# src/test/resources/application-test.properties

spring.jpa.hibernate.ddl-auto=update
# or: none   (if you rely on Flyway/Liquibase or schema.sql)

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Let Testcontainers control the datasource completely
spring.datasource.url=jdbc:tc:mysql:8:///arblog_test
# (only needed if NOT using @ServiceConnection)

rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

web-client-url=mock

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Optional: make duplicate errors clearer
duplicate-email-error=(EMAIL NULLS FIRST)
duplicate-username-error=(USERNAME NULLS FIRST)
duplicate-provideruid-error=(PROVIDER_UID NULLS FIRST)

google.userinfo.url=http://localhost:8888/userinfo